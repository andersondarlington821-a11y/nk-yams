<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Place Order — NK's Premium Yams</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    :root { color-scheme: light dark; }
    
    @media (prefers-color-scheme: light) {
      :root {
        --bg:#FFFBF5;--bg-card:#FFF;--text:#1A0E05;--text-sub:#5C3D2E;
        --accent:#D4920A;--accent-h:#F0A832;--border:rgba(123,63,0,0.1);
        --shadow:0 20px 60px rgba(123,63,0,0.15);
      }
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0A0604;--bg-card:#1A1108;--text:#F5E6D3;--text-sub:#C8B8A8;
        --accent:#F0A832;--accent-h:#FFB84D;--border:rgba(240,168,50,0.15);
        --shadow:0 20px 60px rgba(0,0,0,0.6);
      }
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem}
    .container{max-width:700px;margin:0 auto}
    h1{font-family:'Playfair Display',serif;font-size:2.5rem;margin-bottom:0.5rem;color:var(--text)}
    h1 span{color:var(--accent)}
    .subtitle{color:var(--text-sub);margin-bottom:2rem}
    .form-card{background:var(--bg-card);padding:2.5rem;border-radius:24px;border:1px solid var(--border);box-shadow:var(--shadow)}
    .form-group{margin-bottom:1.5rem}
    label{display:block;font-weight:600;margin-bottom:0.5rem;color:var(--text-sub);font-size:0.9rem}
    input,select,textarea{width:100%;padding:0.9rem;border:2px solid var(--border);border-radius:12px;font-family:'Inter',sans-serif;font-size:1rem;background:var(--bg);color:var(--text);transition:all 0.3s}
    input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px rgba(212,146,10,0.1)}
    .btn{width:100%;padding:1rem;background:linear-gradient(135deg,#D4920A,#F0A832);color:#fff;border:none;border-radius:12px;font-size:1.1rem;font-weight:700;cursor:pointer;margin-top:1rem;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:0.5rem}
    .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(212,146,10,0.4)}
    .alert{padding:1rem;border-radius:12px;margin-bottom:1.5rem;display:none}
    .alert.error{background:rgba(220,38,38,0.1);color:#DC2626;display:block}
    .alert.success{background:rgba(22,163,74,0.1);color:#16A34A;display:block}
    .total{font-size:1.5rem;font-weight:800;color:var(--accent);text-align:right;margin-top:1rem}
    .back-link{display:inline-flex;align-items:center;gap:0.5rem;color:var(--accent);text-decoration:none;margin-bottom:2rem;font-weight:600}
    .back-link:hover{text-decoration:underline}
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">
    <i class="fas fa-arrow-left"></i> Back to Home
  </a>
  
  <h1>Place Your <span>Order</span></h1>
  <p class="subtitle">Fill in your details and we'll deliver fresh yams to your doorstep</p>
  
  <div class="form-card">
    <div class="alert" id="alertBox"></div>
    
    <form id="orderForm">
      <div class="form-group">
        <label for="customerName">Full Name *</label>
        <input type="text" id="customerName" required placeholder="Enter your full name"/>
      </div>
      
      <div class="form-group">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required placeholder="+234 XXX XXX XXXX"/>
      </div>
      
      <div class="form-group">
        <label for="deliveryAddress">Delivery Address *</label>
        <textarea id="deliveryAddress" rows="3" required placeholder="Enter your complete delivery address"></textarea>
      </div>
      
      <div class="form-group">
        <label for="yamType">Yam Type *</label>
        <select id="yamType" required>
          <option value="">Select yam type...</option>
          <option value="Water Yam">Water Yam</option>
          <option value="Yellow Yam">Yellow Yam</option>
          <option value="White Yam">White Yam</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="pricePerTuber">Price Per Tuber (₦) *</label>
        <input type="number" id="pricePerTuber" min="1000" max="3000" value="1500" required/>
        <small style="color:var(--text-sub);font-size:0.85rem">Range: ₦1,000 - ₦3,000</small>
      </div>
      
      <div class="form-group">
        <label for="quantity">Quantity *</label>
        <input type="number" id="quantity" min="1" value="1" required/>
      </div>
      
      <div class="total">Total: <span id="totalPrice">₦1,500</span></div>
      
      <button type="submit" class="btn">
        <i class="fas fa-shopping-cart"></i> Place Order
      </button>
    </form>
  </div>
</div>

<script>
  const API = 'https://nk-yams-api.onrender.com';
  const token = localStorage.getItem('nk_token');
  
  // Redirect if not logged in
  if (!token) {
    alert('Please login to place an order');
    window.location.href = 'login.html?redirect=order.html';
  }
  
  // Calculate total
  const price = document.getElementById('pricePerTuber');
  const qty = document.getElementById('quantity');
  const total = document.getElementById('totalPrice');
  
  function updateTotal() {
    const t = (price.value || 0) * (qty.value || 0);
    total.textContent = `₦${t.toLocaleString('en-NG')}`;
  }
  price.addEventListener('input', updateTotal);
  qty.addEventListener('input', updateTotal);
  
  // Submit order
  document.getElementById('orderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const data = {
      customerName: document.getElementById('customerName').value,
      phone: document.getElementById('phone').value,
      deliveryAddress: document.getElementById('deliveryAddress').value,
      yamType: document.getElementById('yamType').value,
      pricePerTuber: parseInt(price.value),
      quantity: parseInt(qty.value)
    };
    
    try {
      const res = await fetch(`${API}/api/orders`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      
      if (result.success) {
        showAlert(`✅ Order placed successfully! Order ID: ${result.orderId}`, 'success');
        document.getElementById('orderForm').reset();
        updateTotal();
        setTimeout(() => window.location.href = 'index.html', 3000);
      } else {
        showAlert(result.message || 'Failed to place order', 'error');
      }
    } catch (err) {
      showAlert('Connection error. Please try again.', 'error');
    }
  });
  
  function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.className = `alert ${type}`;
    box.textContent = msg;
    setTimeout(() => box.className = 'alert', 5000);
  }
</script>

</body>
</html>
